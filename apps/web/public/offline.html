<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>You are offline · Coaching Institute</title>
    <meta name="theme-color" content="#16204a" />
    <style>
      :root {
        --ink: #17203a;
        --muted: #66718c;
        --brand: #1f2f6b;
        --surface: #f7f9fd;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: radial-gradient(70% 60% at 50% 0%, #e7ecfb, var(--surface));
        color: var(--ink);
        font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
        text-align: center;
      }
      .card {
        max-width: 420px;
        padding: 32px 26px;
        background: #fff;
        border: 1px solid #e3e8f2;
        border-radius: 22px;
        box-shadow: 0 18px 48px rgba(16, 27, 56, 0.1);
      }
      .mark {
        width: 52px;
        height: 52px;
        margin: 0 auto 18px;
        border-radius: 16px;
        background: linear-gradient(145deg, #f5b83d, #e08b0c);
        display: grid;
        place-items: center;
        font-weight: 800;
        color: #22180a;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 1.4rem;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0 0 20px;
        color: var(--muted);
        font-size: 0.92rem;
        line-height: 1.55;
      }
      a {
        display: inline-block;
        padding: 11px 20px;
        border-radius: 999px;
        background: var(--brand);
        color: #fff;
        font-weight: 600;
        font-size: 0.9rem;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="mark" aria-hidden="true">CI</div>
      <h1>You are offline</h1>
      <p>
        Cached pages are still available, but lectures, tests and fee details need a connection.
        Reconnect and try again.
      </p>
      <a href="/">Retry</a>
    </main>
  </body>
</html>
